[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[project]
name = "malideiter"
version = "0.0.0"
description = "Structured logging with Loguru and Rich"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beartype>=0.22.9,<0.23",
    "loguru>=0.7.3,<0.8",
    "rich>=15.0.0,<16",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]

[tool.uv.build-backend]
source-include = ["tests/**", "docs/**", "AGENTS.md", "justfile", "mise.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--cov", "--cov-report=term-missing"]
xfail_strict = true

[tool.coverage.run]
source = ["malideiter"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "D", "E", "F", "I", "PT", "RUF", "S", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.11"
