[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "logalog"
version = "1.0.0"
description = "Readable and structured logging with Loguru and Rich"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taran Lu", email = "taranjlu@gmail.com" }]
keywords = ["logging", "loguru", "rich", "multiprocessing", "structured-logging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3,<0.8",
    "rich>=13.8.1",
]

[project.urls]
Homepage = "https://github.com/taranjlu/logalog"
Issues = "https://github.com/taranjlu/logalog/issues"
Changelog = "https://github.com/taranjlu/logalog/blob/master/CHANGELOG.md"

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4,<2",
    "complexipy>=7.0.1,<8",
    "deptry>=0.25.1,<0.26",
    "hypothesis>=6.168.0,<7",
    "nox>=2026.8.17,<2027",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0,<5",
    "pytest-spec>=6.1.0,<7",
    "pytest-sugar>=1.1.1,<2",
    "pyyaml>=6.0.3,<7",
    "resvg-py>=0.5.0",
    "ruff>=0.16.6",
    "ty>=0.0.79",
    "vulture>=2.16,<3",
]

[tool.uv.build-backend]
source-include = ["tests/**", "docs/**", "examples/**", "AGENTS.md", "CHANGELOG.md", "CONTRIBUTING.md", "justfile", "mise.toml", "noxfile.py", "complexipy-snapshot.json"]
source-exclude = ["/examples/logs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--cov", "--cov-report=term-missing"]
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 90

[tool.coverage.run]
source = ["logalog"]
branch = true
patch = ["subprocess", "_exit"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "D", "E", "F", "I", "PT", "RUF", "S", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.11"
