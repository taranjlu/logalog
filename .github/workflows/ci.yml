name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run complexipy
      - run: uv run deptry src
      - run: uv run vulture
      - run: uv run bandit -r src -ll -ii

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -p no:sugar

  lowest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.11"
      - run: uv sync --locked
      # Test the lowest runtime versions that pyproject.toml allows.
      - run: uv run --with "loguru==0.7.3" --with "rich==13.8.1" pytest -p no:sugar --no-cov

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
      - run: uv build --no-sources
      - run: uvx twine check --strict dist/*
      # Install each artifact outside the checkout and import it.
      - name: Smoke test the wheel and the sdist
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            environment="$(mktemp -d)"
            uv venv --quiet "$environment"
            uv pip install --quiet --python "$environment/bin/python" "$artifact"
            (cd "$environment" && bin/python -I -c 'from logalog import LOG; LOG.info("Import works")')
          done
